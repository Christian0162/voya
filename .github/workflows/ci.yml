name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create placeholder .env
        run: |
          cat > .env << 'EOF'
          GEMINI_API_KEY=ci-placeholder
          GEMINI_MODEL=gemini-3.8-flash
          SUPABASE_URL=https://ci-placeholder.supabase.co
          SUPABASE_ANON_KEY=ci-placeholder
          EOF

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-android:
    name: Build Android (debug)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create placeholder .env
        run: |
          cat > .env << 'EOF'
          GEMINI_API_KEY=ci-placeholder
          GEMINI_MODEL=gemini-3.8-flash
          SUPABASE_URL=https://ci-placeholder.supabase.co
          SUPABASE_ANON_KEY=ci-placeholder
          EOF

      - run: flutter pub get

      # Catches platform-channel/native-plugin issues (Rive, speech_to_text,
      # flutter_tts, permission_handler) that a plain `flutter test` run
      # never exercises since it never compiles for a real platform target.
      - name: Build debug APK
        run: flutter build apk --debug

  file-issue-on-failure:
    name: File issue on main failure
    needs: [analyze-and-test, build-android]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      (needs.analyze-and-test.result == 'failure' || needs.build-android.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          FAILED_JOBS: >-
            ${{ needs.analyze-and-test.result == 'failure' && 'Analyze & Test' || '' }}${{
            needs.analyze-and-test.result == 'failure' && needs.build-android.result == 'failure' && ', ' || '' }}${{
            needs.build-android.result == 'failure' && 'Build Android (debug)' || '' }}
        with:
          filename: .github/ISSUE_TEMPLATE/ci-failure.md
          update_existing: true
